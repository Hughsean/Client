name: Build Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (with release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          TAURI_SKIP_UPDATER: true
        with:
          args: ${{ matrix.args }}

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "情感陪伴（管理员端）${{ github.ref_name }}"
          releaseBody: |
            ## 🎉 v0.2.5-rc.1 候选发布版本

            > ⚠️ **Release Candidate（候选版本）** - 此版本为正式版前的测试版本，包含最新功能和修复，建议在测试环境中使用。

            ### 🐛 问题修复
            - 🔄 **风险监控界面优化**
              - **修复左侧对话列表无法滚动的问题**
                - 重构了 `.aside` 容器的布局结构
                - 添加 `.aside-content` 包装层，优化 flex 布局链
                - 修复了 `UiSkeleton` 组件高度继承问题
                - 确保对话列表在内容较多时可以正常纵向滚动
              - **改进滚动条样式**
                - 优化滚动条视觉效果，宽度调整为 6px
                - 添加悬停效果，提升交互体验
                - 使用半透明青色主题色，保持界面一致性

            ### 🎨 UI/UX 改进
            - 📱 **响应式布局增强**
              - 优化 flex 容器的 `min-height: 0` 设置，避免内容溢出
              - 改进深层嵌套组件的高度传递机制
              - 确保 `UiSkeleton` 和 `UiEmpty` 组件正确适配父容器
            - 🖼️ **视觉细节优化**
              - 保持对话列表项的 hover 和 active 状态动画流畅
              - 优化风险等级标签的边框和背景色渐变效果

            ### 🔧 技术改进
            - 🏗️ **组件结构重构**
              - 在 `RiskConversationsAside.vue` 中增加布局包装层
              - 使用 Vue 3 的 `:deep()` 选择器穿透样式到子组件
              - 改进 CSS 层叠顺序，确保滚动容器正确工作
            - 📦 **版本信息**
              - 应用版本：**v0.2.5-rc.1**
              - 符合 Semantic Versioning 规范
              - 预发布标识：`rc.1`（Release Candidate 1）

            ---

            ## 📦 下载安装

            ### 支持平台
            请根据您的操作系统选择对应的安装包：

            | 操作系统 | 推荐格式 | 说明 |
            |---------|---------|------|
            | 🍎 **macOS** | `.dmg` | 支持 Apple Silicon (M1/M2) |
            | 🪟 **Windows** | `.msi` 或 `.exe` | Windows 10/11 64位 |
            | 🐧 **Linux** | `.AppImage`、`.deb` 或 `.rpm` | Ubuntu 22.04+ / Fedora / 其他发行版 |

            ### 📥 安装步骤
            1. 从下方 Assets 区域下载适合您平台的安装包
            2. 双击运行安装程序
            3. 按照安装向导完成安装
            4. 启动应用程序开始使用！

            ### ⚠️ 注意事项
            - Windows 用户可能需要允许来自未知发布者的应用安装
            - macOS 用户首次打开时需要在"系统偏好设置 > 安全性与隐私"中允许运行
            - Linux 用户可能需要赋予 AppImage 文件执行权限：`chmod +x *.AppImage`

            ---

            ## 📝 完整更新日志
            查看详细变更: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}

            ## 🐛 问题反馈
            如果您在使用过程中遇到任何问题，请[提交 Issue](https://github.com/${{ github.repository }}/issues/new)

            ---

            **感谢使用情感陪伴管理系统！** ❤️
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          retention-days: 7
