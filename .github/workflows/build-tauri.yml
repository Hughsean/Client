name: Build Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (with release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          TAURI_SKIP_UPDATER: true
        with:
          args: ${{ matrix.args }}

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "情感陪伴（管理员端）${{ github.ref_name }}"
          releaseBody: |
            ## 🎉 版本更新说明

            ### 🔧 优化改进
            - 🌐 **网络状态检测优化**
              - 服务器在线状态检测采用直连模式，避免认证失败误判
              - 检测超时时间缩短至 2 秒，提升响应速度
              - 检测频率从 5 秒调整为 2 分钟，减少不必要的网络请求
              - 禁用健康检查接口的自动重试机制
            - 🪟 **退出程序逻辑优化（macOS 兼容）**
              - 优先使用窗口关闭方式（`Window.close()`），提升 macOS 系统兼容性
              - 添加 `exit()` 兜底机制，确保程序可靠退出
              - 增强错误处理，避免退出失败时卡死
            - 🎬 **启动页体验优化**
              - 开发模式使用 `router.push`，方便调试导航
              - 生产模式使用 `router.replace`，避免返回启动页
            - 🧹 **代码清理**
              - 移除控制台调试日志输出
              - 优化代码格式与注释

            ### 🔧 技术更新
            - 📦 **服务器 SDK 升级至 v0.4.3**
              - 新增 `RequestOptions.direct` 选项，支持跳过 JWT/Admin API Key 认证的直连模式
              - `TestApi.hello()` 方法增加可选的 `RequestOptions` 参数
              - 优化 HTTP 客户端，支持更灵活的请求配置
              - 完善 SDK 文档，新增直连模式使用指南
            - 🏷️ **版本号更新**
              - 应用版本升级至 **v0.2.3**
              - Tauri 产品名称统一为 `AI-Admin`
              - Cargo 包名称更新为 `AI-Admin`

            ---

            ## 📦 下载安装

            ### 支持平台
            请根据您的操作系统选择对应的安装包：

            | 操作系统 | 推荐格式 | 说明 |
            |---------|---------|------|
            | 🍎 **macOS** | `.dmg` | 支持 Apple Silicon (M1/M2) |
            | 🪟 **Windows** | `.msi` 或 `.exe` | Windows 10/11 64位 |
            | 🐧 **Linux** | `.AppImage`、`.deb` 或 `.rpm` | Ubuntu 22.04+ / Fedora / 其他发行版 |

            ### 📥 安装步骤
            1. 从下方 Assets 区域下载适合您平台的安装包
            2. 双击运行安装程序
            3. 按照安装向导完成安装
            4. 启动应用程序开始使用！

            ### ⚠️ 注意事项
            - Windows 用户可能需要允许来自未知发布者的应用安装
            - macOS 用户首次打开时需要在"系统偏好设置 > 安全性与隐私"中允许运行
            - Linux 用户可能需要赋予 AppImage 文件执行权限：`chmod +x *.AppImage`

            ---

            ## 📝 完整更新日志
            查看详细变更: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}

            ## 🐛 问题反馈
            如果您在使用过程中遇到任何问题，请[提交 Issue](https://github.com/${{ github.repository }}/issues/new)

            ---

            **感谢使用情感陪伴管理系统！** ❤️
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          retention-days: 7
