name: Build Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (with release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          TAURI_SKIP_UPDATER: true
        with:
          args: ${{ matrix.args }}

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "情感陪伴（管理员端）${{ github.ref_name }}"
          releaseBody: |
            ## 🎉 v0.2.5 正式发布

            ### ✨ 新增功能
            - 🧠 **风险检测判断理由展示**
              - **新增 LLM 判断理由字段**
                - 风险评测卡片现在会显示 AI 检测器给出的判断依据
                - 帮助管理员更好地理解为什么会得出特定的风险等级、情绪和意图结论
                - 判断理由简明扼要（100字以内），例如："消息表达强烈的无助感和自伤倾向"
              - **视觉设计优化**
                - 使用紫色主题背景突出显示判断理由区域
                - 与证据区域的青色主题形成视觉区分
                - 支持自动换行和保留文本格式

            ### 🎯 意图检测增强
            - **新增 5 种意图类型**
              - `CRISIS_SELF_HARM`: 危机/自伤自杀倾向（最高优先级）
              - `CLARIFICATION_REQUEST`: 澄清请求/没听懂
              - `FOLLOW_UP_QUESTION`: 跟进问题/后续追问
              - `OPINION`: 观点表达/主观评价
              - `TOXIC_ABUSE`: 辱骂/冒犯/有害言论
            - **上下文感知检测**
              - LLM 检测器现已配置历史对话上下文窗口
              - 能够基于对话历史分析累积风险趋势
              - 提升对话意图识别的准确性

            ### 🎨 UI/UX 改进
            - 📊 **风险评测卡片增强**
              - 在检测详情中新增"判断理由"板块
              - 位于意图/对象/情感信息之后，处理状态之前
              - 采用紫色边框和背景，与其他信息区块形成对比
            - 🔍 **信息层级优化**
              - 判断理由作为核心信息突出展示
              - 证据信息保持青色主题不变
              - 处理备注继续使用青色主题，保持一致性

            ### 🔧 技术改进
            - 📡 **SDK 升级至 v0.4.5**
              - `AdminRiskMessageDetection.reason` 字段支持
              - 字段类型：`string | undefined`
              - 向后兼容：旧数据可能为 `undefined`
            - 🗄️ **后端数据结构更新**
              - 数据库 `risk_detection_results` 表新增 `reason` 字段
              - LLM 提示词更新，要求输出判断理由
              - 自动存储每次检测的推理依据
            - 📦 **版本信息**
              - 前端应用版本：**v0.2.5**
              - SDK 版本：**v0.4.5**

            ---

            ## 📦 下载安装

            ### 支持平台
            请根据您的操作系统选择对应的安装包：

            | 操作系统 | 推荐格式 | 说明 |
            |---------|---------|------|
            | 🍎 **macOS** | `.dmg` | 支持 Apple Silicon (M1/M2) |
            | 🪟 **Windows** | `.msi` 或 `.exe` | Windows 10/11 64位 |
            | 🐧 **Linux** | `.AppImage`、`.deb` 或 `.rpm` | Ubuntu 22.04+ / Fedora / 其他发行版 |

            ### 📥 安装步骤
            1. 从下方 Assets 区域下载适合您平台的安装包
            2. 双击运行安装程序
            3. 按照安装向导完成安装
            4. 启动应用程序开始使用！

            ### ⚠️ 注意事项
            - Windows 用户可能需要允许来自未知发布者的应用安装
            - macOS 用户首次打开时需要在"系统偏好设置 > 安全性与隐私"中允许运行
            - Linux 用户可能需要赋予 AppImage 文件执行权限：`chmod +x *.AppImage`

            ---

            ## 📝 完整更新日志
            查看详细变更: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}

            ## 🐛 问题反馈
            如果您在使用过程中遇到任何问题，请[提交 Issue](https://github.com/${{ github.repository }}/issues/new)

            ---

            **感谢使用情感陪伴管理系统！** ❤️
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          retention-days: 7
