name: Build Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (with release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          TAURI_SKIP_UPDATER: true
        with:
          args: ${{ matrix.args }}

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "情感陪伴（管理员端）${{ github.ref_name }}"
          releaseBody: |
            ## 🎉 版本更新说明

            ### 🎯 意图检测增强
            - 🧠 **新增 5 种意图类型识别**
              - **危机/自伤**：识别自伤自杀倾向，最高优先级预警
              - **澄清请求**：识别用户没听懂或需要解释的情况
              - **跟进问题**：识别用户的后续追问与延续性对话
              - **观点表达**：识别用户的主观评价与态度陈述
              - **辱骂/有害**：识别冒犯性言论与有害内容
            - 🎨 **前端展示优化**
              - 风险评测卡片支持新增意图类型的中文显示
              - 意图标签样式优化，提升可读性
              - 完善风险检测详情页面的信息层级

            ### 🔧 技术更新
            - 📦 **服务器 SDK 升级至 v0.4.4**
              - `Intent` 类型扩展，新增 5 个枚举值
              - 后端风险检测规则库已更新，支持新意图自动识别
              - LLM 检测器配置上下文窗口，可基于历史对话分析累积风险
            - 🏷️ **版本号更新**
              - 应用版本升级至 **v0.2.3_1**

            ---

            ## 📦 下载安装

            ### 支持平台
            请根据您的操作系统选择对应的安装包：

            | 操作系统 | 推荐格式 | 说明 |
            |---------|---------|------|
            | 🍎 **macOS** | `.dmg` | 支持 Apple Silicon (M1/M2) |
            | 🪟 **Windows** | `.msi` 或 `.exe` | Windows 10/11 64位 |
            | 🐧 **Linux** | `.AppImage`、`.deb` 或 `.rpm` | Ubuntu 22.04+ / Fedora / 其他发行版 |

            ### 📥 安装步骤
            1. 从下方 Assets 区域下载适合您平台的安装包
            2. 双击运行安装程序
            3. 按照安装向导完成安装
            4. 启动应用程序开始使用！

            ### ⚠️ 注意事项
            - Windows 用户可能需要允许来自未知发布者的应用安装
            - macOS 用户首次打开时需要在"系统偏好设置 > 安全性与隐私"中允许运行
            - Linux 用户可能需要赋予 AppImage 文件执行权限：`chmod +x *.AppImage`

            ---

            ## 📝 完整更新日志
            查看详细变更: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}

            ## 🐛 问题反馈
            如果您在使用过程中遇到任何问题，请[提交 Issue](https://github.com/${{ github.repository }}/issues/new)

            ---

            **感谢使用情感陪伴管理系统！** ❤️
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          retention-days: 7
