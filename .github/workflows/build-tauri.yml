name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app (with release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          TAURI_SKIP_UPDATER: true
        with:
          args: ${{ matrix.args }}

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '情感陪伴（管理员端）${{ github.ref_name }}'
          releaseBody: |
            ## 🎉 版本更新说明
            
            ### ✨ 新增功能
            - 🔐 新增管理员 API 密钥认证机制
            - 🛡️ 增强安全特性，提升系统安全性
            - 📊 优化用户资料管理，支持数据备份与恢复
            - 🎨 界面美化，提升用户体验
            
            ### 🔧 优化改进
            - 📁 调整目录结构，代码组织更清晰
            - 🔄 更新用户详情页面，信息展示更友好
            - 🚀 性能优化，提升应用响应速度
            - 🪟 优化窗口属性配置
            
            ### 🛠️ 技术更新
            - ⬆️ 升级 Rust 2024 edition，要求 Rust 1.85+
            - 📦 支持多种打包格式（MSI, NSIS, DEB, RPM, AppImage）
            - 🔨 改进构建工作流，优化发布流程
            
            ---
            
            ## 📦 下载安装
            
            ### 支持平台
            请根据您的操作系统选择对应的安装包：
            
            | 操作系统 | 推荐格式 | 说明 |
            |---------|---------|------|
            | 🍎 **macOS** | `.dmg` | 支持 Apple Silicon (M1/M2) |
            | 🪟 **Windows** | `.msi` 或 `.exe` | Windows 10/11 64位 |
            | 🐧 **Linux** | `.AppImage`、`.deb` 或 `.rpm` | Ubuntu 22.04+ / Fedora / 其他发行版 |
            
            ### 📥 安装步骤
            1. 从下方 Assets 区域下载适合您平台的安装包
            2. 双击运行安装程序
            3. 按照安装向导完成安装
            4. 启动应用程序开始使用！
            
            ### ⚠️ 注意事项
            - Windows 用户可能需要允许来自未知发布者的应用安装
            - macOS 用户首次打开时需要在"系统偏好设置 > 安全性与隐私"中允许运行
            - Linux 用户可能需要赋予 AppImage 文件执行权限：`chmod +x *.AppImage`
            
            ---
            
            ## 📝 完整更新日志
            查看详细变更: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref_name }}
            
            ## 🐛 问题反馈
            如果您在使用过程中遇到任何问题，请[提交 Issue](https://github.com/${{ github.repository }}/issues/new)
            
            ---
            
            **感谢使用情感陪伴管理系统！** ❤️
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          retention-days: 7
